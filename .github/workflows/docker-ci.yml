name: CI

on:
  pull_request:
    branches: [ main ]
    # Only run backend tests when backend-facing files change.
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'server/**'
      - 'test/*.test.js'   # top-level backend tests only
      - '!src/edge/**'
      - '!test/edge/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: node --test "test/*.test.js"
