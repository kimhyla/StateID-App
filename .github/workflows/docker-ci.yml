name: ci

on:
  push:
    branches:
      - main
      - mvp-redirect-worker
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Backend unit tests (only if src/server.js exists)
        if: ${{ hashFiles('src/server.js') != '' }}
        run: npm test

      - name: Skip backend unit tests (no src/server.js)
        if: ${{ hashFiles('src/server.js') == '' }}
        run: echo "Skipping backend tests: src/server.js not present on this branch."

      - name: Edge worker tests (if present)
        if: ${{ hashFiles('test/edge/**/*.mts') != '' }}
        run: npm run edge:test
