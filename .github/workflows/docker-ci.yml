name: ci

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'src/server.js'
      - 'src/server.ts'
      - 'src/server/**'
      - 'test/*.test.js'
  push:
    branches: [ main, mvp-redirect-worker ]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'src/server.js'
      - 'src/server.ts'
      - 'src/server/**'
      - 'test/*.test.js'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: node --test "test/*.test.js"

      - name: Smoke test
        run: |
          node --version
          echo ok
