# File: .github/workflows/docker-ci.yml
# Purpose: Build and run a light "edge container" that exposes /healthz so PRs can pass.
# Notes:
# - Uses a dedicated Dockerfile that does NOT try to run src/server.js.
# - Maps container 3000 -> host 8787 and waits for /healthz and /.
# - Dumps container logs if anything goes wrong.

name: docker-ci

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build edge image
        run: |
          docker build \
            -f ops/edge/Dockerfile \
            -t stateid-edge:pr-${{ github.run_id }} \
            .

      - name: Run container (PORT=3000, map 8787->3000)
        run: |
          docker run -d \
            --name stateid-edge \
            -e PORT=3000 \
            -p 8787:3000 \
            stateid-edge:pr-${{ github.run_id }}

      - name: Wait for service (try /healthz then /)
        run: |
          set -euxo pipefail
          BASE="http://127.0.0.1:8787"
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -m 3 "$BASE/healthz" || echo 000)
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 500 ]; then
              echo "healthz is ready ($CODE)"
              exit 0
            fi
            CODE2=$(curl -sS -o /dev/null -w '%{http_code}' -m 3 "$BASE/" || echo 000)
            if [ "$CODE2" -ge 200 ] && [ "$CODE2" -lt 500 ]; then
              echo "root is ready ($CODE2)"
              exit 0
            fi
            echo "Not ready yet (healthz=$CODE, root=$CODE2); retrying…"
            sleep 3
          done
          echo "❌ Service never became ready on $BASE"
          echo "---- docker ps ----"
          docker ps -a
          echo "---- container logs ----"
          docker logs stateid-edge || true
          exit 1

      - name: Stop and remove container
        if: always()
        run: |
          docker stop stateid-edge || true
          docker rm   stateid-edge || true
