# File: .github/workflows/docker-ci.yml
# Robust edge container check:
# - Build image
# - Run with PORT=3000 and map 8787->3000
# - Probe /healthz and, if missing, fall back to /
# - On failure, dump docker ps + container logs for diagnosis
name: docker-ci

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build edge image
        run: |
          set -euxo pipefail
          docker build -t stateid-edge:pr-${GITHUB_RUN_ID} .

      - name: Run container (PORT=3000, map 8787->3000)
        run: |
          set -euxo pipefail
          docker rm -f stateid-edge || true
          docker run -d --name stateid-edge \
            -e PORT=3000 \
            -p 8787:3000 \
            stateid-edge:pr-${GITHUB_RUN_ID}
          sleep 2
          docker ps -a

      - name: Wait for service (try /healthz then /)
        run: |
          set -euxo pipefail
          BASE="http://127.0.0.1:8787"
          # wait up to ~90s total
          for i in $(seq 1 30); do
            # Try /healthz (expect 2xx/3xx). If 404 or connection fails, try /
            CODE="$(curl -sS -o /dev/null -w "%{http_code}" -m 3 ${BASE}/healthz || echo 000)"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
              echo "✅ /healthz ready ($CODE)"
              READY=1
              break
            fi
            CODE2="$(curl -sS -o /dev/null -w "%{http_code}" -m 3 ${BASE}/ || echo 000)"
            if [ "$CODE2" -ge 200 ] && [ "$CODE2" -lt 400 ]; then
              echo "✅ / ready ($CODE2)"
              READY=1
              break
            fi
            echo "Not ready yet (healthz=$CODE, root=$CODE2); retrying…"
            sleep 3
          done
          if [ "${READY:-0}" != "1" ]; then
            echo "❌ Service never became ready on ${BASE}"
            echo "---- docker ps ----"; docker ps -a || true
            echo "---- container logs ----"; docker logs stateid-edge || true
            exit 1
          fi

      - name: Stop container
        if: always()
        run: |
          docker logs stateid-edge || true
          docker rm -f stateid-edge || true
