# File: .github/workflows/ci.yml
# Purpose: Keep required “ci” check green; only run backend tests when *added/modified*
#          backend code (or backend-specific tests) change. Ignore deletions/renames.
#          Exclude edge/worker tests so Cloudflare-only PRs skip backend tests.
name: ci

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # dorny/paths-filter with type-aware rules:
      # - Only count ADDED or MODIFIED files (deletions/renames do NOT trigger).
      # - Exclude edge tests (test/edge/**) so worker-only PRs skip backend tests.
      - name: Compute changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            backend:
              # BACKEND SOURCE — only added/modified trigger
              - added|modified: 'server/**'
              - added|modified: 'src/server.js'
              - added|modified: 'src/server.ts'
              - added|modified: 'src/server/**'

              # BACKEND TESTS — narrow to backend-focused locations
              # (Adjust these if you later organize server tests differently)
              - added|modified: 'test/server/**'
              - added|modified: 'server/**/__tests__/**'

              # EXCLUDES — do not treat these as backend changes
              - '!test/edge/**'
              - '!workers/**'
              - '!src/edge/**'

      - name: Summarize match result
        if: always()
        run: |
          echo "backend changed? -> ${{ steps.filter.outputs.backend }}" | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Matched backend files (if any):" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.filter.outputs.backend_files }}' >> $GITHUB_STEP_SUMMARY

  test:
    name: Backend unit tests
    needs: changes
    # Run if: backend changed OR push to main
    if: ${{ needs.changes.outputs.backend == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run backend unit tests
        run: npm test --silent

      - name: Node version
        run: node --version && echo ok

